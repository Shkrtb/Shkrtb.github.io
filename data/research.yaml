# 研究
title: 小型カメラとIMUを搭載したイヤホン型端末による、装着者の全身の姿勢推定

summary: >-
  周囲にカメラを設置せず、イヤホンを装着するだけで全身の姿勢を推定することを目指している。
  端末に外向きの小型カメラを搭載して腕や脚の位置を計測し、
  IMU（加速度と角速度を測る装置）のみを用いる先行研究における精度の課題の解決を図る。

tasks:
  - 端末の試作
  - 機械学習モデルの設計
  - Unreal Engine上での合成データの生成基盤の構築

